# SecureGSI cargo-deny policy
#
# Scope:
#   - Linux/WSL host analysis
#   - Android ARM64 production target
#
# This avoids making Windows-only transitive crates part of the policy for an
# Android/Linux project while still checking the dependency graph we actually
# compile and ship.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
]
all-features = true

# ---------------------------------------------------------------------------
# RustSec advisories
# ---------------------------------------------------------------------------

[advisories]
# Flag unmaintained crates when they are part of our workspace/relevant graph.
unmaintained = "workspace"

# Treat known unsoundness advisories as errors.
unsound = "all"

# Do not silently waive security advisories.
ignore = []

# ---------------------------------------------------------------------------
# Dependency policy
# ---------------------------------------------------------------------------

[bans]
# Duplicate versions are worth reviewing, but are not automatically a
# vulnerability. Keep them visible without breaking the security gate.
multiple-versions = "warn"

# Wildcard versions make builds less reproducible and are not allowed.
wildcards = "deny"

# ---------------------------------------------------------------------------
# Dependency sources
# ---------------------------------------------------------------------------

[sources]
# Dependencies must come from known registries or explicitly reviewed sources.
unknown-registry = "deny"
unknown-git = "deny"

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------

[licenses]
# Check dev dependencies too because SecureGSI's tests/security tooling are part
# of the project's assurance process.
include-dev = true

# Build dependencies can affect produced artifacts, so keep them checked.
include-build = true

# Require high confidence when cargo-deny infers a license from license text.
confidence-threshold = 0.95

# Do not fail merely because an approved license is not currently present.
unused-allowed-license = "allow"
unused-license-exception = "allow"

# Licenses not listed here are denied by default.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "GPL-3.0-only",
]

# BSD-3-Clause is not globally approved.
# It is allowed only for the reviewed `subtle` dependency used by the
# cryptographic dependency chain.
exceptions = [
    { crate = "subtle@2.6.1", allow = ["BSD-3-Clause"] },
]
